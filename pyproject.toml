[project]
name = "comp-matsuo-pai-final-2026"
version = "0.1.0"
description = "Language-instructed pick-and-place robot arm in MuJoCo with Claude"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.17.0",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "mujoco>=3.16.0",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tidy_arm"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
